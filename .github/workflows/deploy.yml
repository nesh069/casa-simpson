name: Build, Test and Deploy Casa Simpson

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps   # <-- changed

      - name: Create .env for tests
        run: |
          echo "VITE_FIREBASE_API_KEY=test-api-key" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=test.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=test-project" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=test.appspot.com" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=123456789" >> .env
          echo "VITE_FIREBASE_APP_ID=1:123456789:web:test" >> .env
          echo "VITE_GOOGLE_MAPS_API_KEY=test-maps-key" >> .env
          echo "VITE_FLW_PUBLIC_KEY=test-flw-key" >> .env

      - name: Run tests
        run: npm run test -- --run
        env:
          CI: true

      - name: Run tests with coverage
        run: npm run coverage
        env:
          CI: true
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps   # <-- changed

      - name: Create .env from secrets
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" >> .env
          echo "VITE_FLW_PUBLIC_KEY=${{ secrets.VITE_FLW_PUBLIC_KEY }}" >> .env

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist